[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragcheckup"
version = "0.1.0a0"
description = "Inspects the index behind a RAG system and reports structural problems that make retrieval fail."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nagaraju", email = "nagaraju@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
chroma = [
    "chromadb>=0.5",
]
embed = [
    "sentence-transformers>=3.0",
]
llm = [
    "litellm>=1.0",
]
all = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "litellm>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
ragcheckup = "ragcheckup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcheckup"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
files = ["src/ragcheckup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
